<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Q&A</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div class="container">
    
    <!-- Simple Header -->
    <header class="header">
      <h1>Document Q&A</h1>
      <p class="subtitle">Upload a PDF or TXT file and ask questions about it.</p>
    </header>

    <!-- 1. Upload Section -->
    <div class="card upload-section">
      <div class="upload-row">
        <label for="file-input" class="btn btn-secondary" id="choose-file-btn">
          <span>Choose File</span>
          <input type="file" id="file-input" accept=".pdf,.txt">
        </label>
        <span class="file-name" id="selected-file-label">No file selected</span>
        <button class="btn btn-primary" id="btn-upload" disabled>Upload</button>
      </div>
      <div class="upload-status" id="upload-status"></div>
      
      <!-- Currently Loaded Documents -->
      <div class="docs-loaded" id="docs-loaded" style="display: none;">
        <span class="docs-label">Active Document:</span>
        <span class="doc-badge" id="active-doc-name">—</span>
      </div>
    </div>

    <!-- 2. Question Input Section -->
    <div class="card question-section">
      <form id="question-form">
        <div class="input-row">
          <input 
            type="text" 
            id="question-input" 
            placeholder="Ask a question about your document..." 
            autocomplete="off"
            required
          >
          <button type="submit" class="btn btn-primary" id="btn-ask">Ask</button>
        </div>
      </form>
    </div>

    <!-- 3. Answers Feed -->
    <div class="answers-section" id="answers-container">
      <!-- Answers will appear here -->
    </div>

  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
